# Netlify build configuration for Traceo (Next.js)

[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js runtime is auto-detected; no legacy plugin reference needed.

# Inline security headers applied at the edge before content is served.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com; font-src 'self'; connect-src 'self' https://ncexqufycjbzhxwbatqx.supabase.co wss://ncexqufycjbzhxwbatqx.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.upstash.io https://generativelanguage.googleapis.com https://api.resend.com https://va.vercel-scripts.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# The firewall edge function declares its own path config inline
# (netlify/edge-functions/firewall.ts), so no [[edge_functions]] entry is required.